<html lang="en">
<head>

<title>Unit 8 – Healthy Body, Healthy Mind · Grammar Quiz v3</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>

  --teal-soft:#e9fbf5;

  --peach-soft:#fff2ea;
  --lilac:#b9a8ff;

  --red:#e45b68;
  --red-soft:#fff1f3;
  --red-dark:#8f2238;
  --ink:#17324d;
  --muted:#667a92;
  --line:#dbe7f3;
  --card:#ffffff;

html{scroll-behavior:smooth}
body{

}
.banner-text{position:relative;z-index:1}

.banner-badge{position:relative;z-index:1;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.6);color:#265273;font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;border-radius:999px;padding:11px 16px;white-space:nowrap;box-shadow:0 10px 20px rgba(37,73,114,.12)}

.qw{max-width:920px;margin:0 auto;position:relative}

.badge{font-size:14px;font-weight:900;padding:8px 14px;border-radius:999px;letter-spacing:.1px;font-family:'Nunito',sans-serif}

.obtn{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;font-size:clamp(20px,2.05vw,25px);line-height:1.45;color:var(--ink);cursor:pointer;min-height:74px;box-shadow:0 6px 16px rgba(36,83,130,.05)}
.obtn:hover:not(:disabled){background:var(--peach-soft);border-color:#ffc4a6;transform:translateY(-1px)}
.obtn.correct{border-color:#93e4c3;background:var(--teal-soft);color:#0f634c}

.chips{display:flex;flex-wrap:wrap;gap:13px;margin-bottom:16px}
.wchip{background:#fff;border:1.5px solid var(--line);border-radius:19px;padding:14px 20px;font-size:clamp(20px,2.05vw,25px);color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap;box-shadow:0 6px 16px rgba(36,83,130,.05)}
.wchip:hover:not(.used){background:var(--sky-soft);border-color:#b8dbff;color:#144f86;transform:translateY(-1px)}

.abox{min-height:88px;border:2px dashed #d0e0ef;border-radius:22px;padding:16px;display:flex;flex-wrap:wrap;gap:11px;background:linear-gradient(180deg,#fbfdff,#f7fbff);align-items:center;margin-bottom:15px}

.achip:hover{filter:brightness(.96)}

.aph{color:#96a9bc;font-size:17px;font-family:'Nunito',sans-serif;font-weight:800}
.ckbtn,.nbtn{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:13px 24px;font-size:18px;color:var(--ink);cursor:pointer;box-shadow:0 6px 16px rgba(36,83,130,.05)}

.fb{font-size:17px;margin-top:15px;padding:16px 18px;border-radius:18px;line-height:1.68;animation:fadeUp .2s ease}

.fb-label{font-size:13px;font-weight:900;letter-spacing:.45px;margin-top:8px;margin-bottom:4px;opacity:.72;text-transform:uppercase;font-family:'Nunito',sans-serif}
.fb-sentence{font-size:18px;font-family:'Nunito',sans-serif;font-weight:900;line-height:1.7;font-style:normal}
.hi{background:#bbf7d0;color:#14532d;border-radius:6px;padding:0 4px;font-style:normal}
.fb.no .hi{background:#fecaca;color:#7f1d1d}

.navrow{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:1rem}

.nbtn.pri{background:linear-gradient(135deg,var(--teal),#55d5b1);color:#fff;border-color:transparent;box-shadow:0 14px 24px rgba(47,194,155,.2)}

.scard{background:rgba(255,255,255,.97);border:1.5px solid var(--line);border-radius:28px;padding:2.35rem 1.8rem;text-align:center;box-shadow:var(--shadow)}
.trophy{font-size:3.5rem;margin-bottom:.5rem;animation:bounce .6s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.sbig{font-size:52px;font-weight:900;color:var(--teal-dark);font-family:'Nunito',sans-serif;line-height:1}
.slbl{font-size:15px;color:var(--muted);margin-top:8px;font-family:'Nunito',sans-serif;font-weight:800}
.smsg{font-size:16px;font-weight:900;color:var(--ink);margin-top:6px;font-family:'Nunito',sans-serif}
.sbreak{display:flex;gap:12px;justify-content:center;margin-top:1.2rem;flex-wrap:wrap}
.sbi{background:#f7fbff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:16px;color:#245a79;font-family:'Nunito',sans-serif;font-weight:800}
.rbtn{margin-top:1.5rem;background:linear-gradient(135deg,var(--sky),var(--lilac));color:#fff;border:none;border-radius:999px;padding:14px 34px;font-size:18px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;transition:filter .14s;box-shadow:0 12px 24px rgba(105,183,255,.24)}
.rbtn:hover{filter:brightness(.96)}

@media(max-width:720px){
  body{padding:1rem .75rem 1.45rem}
  .banner{grid-template-columns:1fr;justify-items:start;padding:1.05rem 1.05rem 1.15rem;border-radius:26px}
  .banner-badge{margin-top:2px}
  .part-tabs{grid-template-columns:1fr}
  .prog-row{flex-wrap:wrap}
  .qcard{padding:1.15rem 1rem;border-radius:24px}
  .ptab{font-size:15px;padding:13px 14px}
  .opts{grid-template-columns:1fr}
  .sentence-line{font-size:24px}
  .err-sentence{font-size:22px;padding:16px 17px}
  .mbtn,.obtn,.wchip,.achip{font-size:21px}
  .ckbtn,.nbtn{font-size:17px}
  .navrow{flex-direction:column;align-items:stretch}
  .nav-left{display:grid;grid-template-columns:1fr 1fr;width:100%}
}

</style>

<body>

<div class="banner">
  <div class="banner-icon">🌿</div>
  <div class="banner-text">
    <h1>Unit 8 – Healthy Body, Healthy Mind</h1>
    <div class="grammar-label">Grammar focus</div>
    <div class="grammar-pills">
      <span class="gpill">must / must not</span>
      <span class="gpill">It’s good / easy / hard to…</span>
      <span class="gpill">health routines</span>
      <span class="gpill">advice & rules</span>
    </div>
  </div>
  <div class="banner-badge">42 questions</div>
</div>

<div class="qw" id="app"></div>

<script>
const QS=[
  // ── TYPE 1: MCQ – Choose the correct word ──
  {t:1,before:'You',after:'drink a lot of water every day.',options:['must','must not'],answer:'must'},
  {t:1,before:'You',after:'eat junk food when you have a stomachache.',options:['must','must not'],answer:'must not'},
  {t:1,before:'When you have a cough, you',after:'see a doctor.',options:['must','must not'],answer:'must'},
  {t:1,before:'You',after:'stay up late when you are sick.',options:['must','must not'],answer:'must not'},
  {t:1,before:'She has a sore neck. She',after:'rest at home.',options:['must','must not'],answer:'must'},
  {t:1,before:'You',after:'share your medicine with other people.',options:['must','must not'],answer:'must not'},
  {t:1,before:'He has a toothache. He',after:'eat sweet food.',options:['must','must not'],answer:'must not'},
  {t:1,before:'You',after:'wash your hands before meals.',options:['must','must not'],answer:'must'},
  {t:1,before:"It's good",after:'exercise every morning.',options:['to','—'],answer:'to'},
  {t:1,before:'It',after:"always easy to eat healthy food.",options:["isn't","is"],answer:"isn't"},
  {t:1,before:"It's important",after:'get enough sleep every night.',options:['to','for'],answer:'to'},
  {t:1,before:'It',after:"hard to stop eating sweet food.",options:["isn't","is"],answer:"isn't"},
  {t:1,before:"It's good",after:'do yoga when you feel worried.',options:['to','for'],answer:'to'},
  {t:1,before:'It',after:"easy to stay calm during exams.",options:["isn't","is"],answer:"isn't"},

  // ── TYPE 2: Find the error ──
  {t:2,sentence:'You must to drink water after exercise.',parts:['You','must to drink','water','after exercise'],correct:1,fix:'You <hi>must drink</hi> water after exercise.',reason:'"must" is a modal verb — never use "to" directly after it'},
  {t:2,sentence:'She must not eats junk food when she has a cold.',parts:['She','must not eats','junk food','when she has a cold'],correct:1,fix:'She <hi>must not eat</hi> junk food when she has a cold.',reason:'After "must not", always use the base form of the verb (no "-s")'},
  {t:2,sentence:'It\'s good do yoga in the morning.',parts:["It's good","do yoga","in the morning","every day"],correct:1,fix:"It's good <hi>to do</hi> yoga in the morning.",reason:'After "It\'s + adjective", always use "to + verb"'},
  {t:2,sentence:'You must not to run in the hospital.',parts:['You','must not to run','in the hospital','today'],correct:1,fix:'You <hi>must not run</hi> in the hospital.',reason:'"must not" does not need "to" — use the base verb directly'},
  {t:2,sentence:'It isn\'t always easy learning at school.',parts:["It isn't always easy","learning at school","for students","every day"],correct:1,fix:"It isn't always easy <hi>to learn</hi> at school.",reason:'Use "to + verb" (infinitive), not "-ing", after "It\'s + adjective"'},
  {t:2,sentence:'He must takes medicine every morning.',parts:['He','must takes','medicine','every morning'],correct:1,fix:'He <hi>must take</hi> medicine every morning.',reason:'After "must", always use the base form — never add "-s"'},
  {t:2,sentence:'It\'s important get enough sleep.',parts:["It's important","get enough sleep","for children","every night"],correct:1,fix:"It's important <hi>to get</hi> enough sleep.",reason:'After "It\'s + adjective", use "to + verb"'},
  {t:2,sentence:'You must not eats sweets when you have a toothache.',parts:['You','must not eats','sweets','when you have a toothache'],correct:1,fix:'You <hi>must not eat</hi> sweets when you have a toothache.',reason:'After "must not", use the base verb — no "-s" or "-ing"'},
  {t:2,sentence:'It is good to does exercise every day.',parts:['It is good','to does exercise','every day','to stay healthy'],correct:1,fix:'It is good <hi>to do</hi> exercise every day.',reason:'After "to", use the base form of the verb — not "does"'},
  {t:2,sentence:'She must not runs in the corridor when she has a back pain.',parts:['She','must not runs','in the corridor','when she has a back pain'],correct:1,fix:'She <hi>must not run</hi> in the corridor.',reason:'After "must not", use the base verb — no "-s"'},
  {t:2,sentence:'It\'s hard stopping worrying about your grades.',parts:["It's hard","stopping worrying","about your grades","at school"],correct:1,fix:"It's hard <hi>to stop</hi> worrying about your grades.",reason:'After "It\'s + adjective", use "to + verb", not "-ing"'},
  {t:2,sentence:'You must to sit down when your back hurts.',parts:['You','must to sit down','when your back hurts','at home'],correct:1,fix:'You <hi>must sit down</hi> when your back hurts.',reason:'"must" never takes "to" — use the base verb directly'},
  {t:2,sentence:'It is good to staying calm when you feel sick.',parts:['It is good','to staying calm','when you feel sick','at the doctor'],correct:1,fix:'It is good <hi>to stay</hi> calm when you feel sick.',reason:'After "to", use the base form — not "staying"'},
  {t:2,sentence:'He must not uses someone else\'s medicine.',parts:['He','must not uses',"someone else's medicine","without asking"],correct:1,fix:"He <hi>must not use</hi> someone else's medicine.",reason:'After "must not", always use the base form — no "-s"'},

  // ── TYPE 3: Arrange the chunks ──
  {t:3,chunks:['You','must drink','water','every day'],answer:'You must drink water every day.'},
  {t:3,chunks:['You','must not eat','junk food','when you are sick'],answer:'You must not eat junk food when you are sick.'},
  {t:3,chunks:["It's good","to do","yoga","every morning"],answer:"It's good to do yoga every morning."},
  {t:3,chunks:["It isn't always easy","to stay calm","during","an exam"],answer:"It isn't always easy to stay calm during an exam."},
  {t:3,chunks:['She','must take','medicine','twice a day'],answer:'She must take medicine twice a day.'},
  {t:3,chunks:["It's important","to get","enough sleep","every night"],answer:"It's important to get enough sleep every night."},
  {t:3,chunks:['You','must not run','in the hospital'],answer:'You must not run in the hospital.'},
  {t:3,chunks:["It isn't","always easy","to learn","at school"],answer:"It isn't always easy to learn at school."},
  {t:3,chunks:['He','must rest','at home','when he has a cold'],answer:'He must rest at home when he has a cold.'},
  {t:3,chunks:["It's good","to wash","your hands","before meals"],answer:"It's good to wash your hands before meals."},
  {t:3,chunks:['You','must not stay up','late','when you are sick'],answer:'You must not stay up late when you are sick.'},
  {t:3,chunks:["It's hard","to stop","worrying","about your grades"],answer:"It's hard to stop worrying about your grades."},
  {t:3,chunks:['You','must sit down','when','your back hurts'],answer:'You must sit down when your back hurts.'},
  {t:3,chunks:["It's good","to exercise","every day","to stay healthy"],answer:"It's good to exercise every day to stay healthy."},
];

function seededShuffle(arr,seed){
  const a=[...arr];let s=seed;
  for(let i=a.length-1;i>0;i--){
    s=(s*1664525+1013904223)&0xffffffff;
    const j=Math.abs(s)%(i+1);[a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const SHUFFLE={};
QS.forEach((q,i)=>{
  if(q.t===3){
    let sh=seededShuffle(q.chunks.map((_,j)=>j),i*31+7);
    if(sh[0]===0){const sw=sh.findIndex((x,p)=>p>0);[sh[0],sh[sw]]=[sh[sw],sh[0]];}
    SHUFFLE[i]=sh;
  }
});

let cur=0,score=0,answered=[],arState={};
function norm(s){return s.trim().toLowerCase().replace(/[.!?]/g,'').replace(/\s+/g,' ');}
function hiHTML(s){return s.replace(/<hi>(.*?)<\/hi>/g,'<span class="hi">$1</span>');}
const typeLabel=['','Choose the answer','Find the error','Arrange the chunks'];
const typeColor=['','b1','b2','b3'];
const typeIcon=['','✏️','🔍','🔀'];

const PARTS=[
  {label:'Part 1',icon:'✏️',start:0,size:14},
  {label:'Part 2',icon:'🔍',start:14,size:14},
  {label:'Part 3',icon:'🔀',start:28,size:14},
];
function partOf(i){return i<14?0:i<28?1:2;}

function fitTextOneLine(el,max,min){
  if(!el) return;
  const original = parseFloat(getComputedStyle(el).fontSize);
  let size = max || original;
  el.style.whiteSpace = 'nowrap';
  el.style.overflow = 'hidden';
  el.style.textOverflow = 'clip';
  el.style.fontSize = size + 'px';
  while(size > (min || 16) && el.scrollWidth > el.clientWidth){
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}
function applyAdaptiveLayout(){
  const sentence = document.querySelector('.sentence-line');
  const err = document.querySelector('.err-sentence');
  const helper = document.querySelector('.helper-line');
  if(sentence) fitTextOneLine(sentence, null, 18);
  if(err) fitTextOneLine(err, null, 17);
  if(helper) fitTextOneLine(helper, null, 13);
}
function renderTabs(cur){
  return `<div class="part-tabs">${PARTS.map((p,pi)=>{
    const done=answered.slice(p.start,p.start+p.size).filter(x=>x!==undefined).length;
    const isActive=partOf(cur)===pi;
    return `<button class="ptab${isActive?' active':''}" onclick="go(${p.start})">${p.icon} ${p.label}<span class="pt-label">${done}/${p.size} done</span></button>`;
  }).join('')}</div>`;}


function render(i){
  const q=QS[i];
  const done=answered.filter(x=>x!==undefined).length;
  const correct=answered.filter(x=>x==='ok').length;
  const pct=Math.round((done/QS.length)*100);
  let body='';

  if(q.t===1){
    const dis=answered[i]!==undefined;
    const btns=q.options.map((opt,j)=>{
      let cls='mbtn';
      if(dis){
        if(opt===q.answer)cls='mbtn correct';
        else if(answered[i]===opt)cls='mbtn wrong';
      }
      return `<button class="${cls}" onclick="pickMCQ(${i},'${opt.replace(/'/g,"\\'")}')" ${dis?'disabled':''}>${opt}</button>`;
    }).join('');
    body=`<div class="sentence-line">${q.before} <span class="blank"></span> ${q.after}</div>
    <div class="mcq-opts">${btns}</div>`;
  } else if(q.t===2){
    const opts=q.parts.map((p,j)=>{
      let cls='obtn';
      if(answered[i]!==undefined){
        if(j===q.correct)cls='obtn correct';
        else if(typeof answered[i]==='number'&&answered[i]===j)cls='obtn wrong';
      }
      return `<button class="${cls}" id="op${i}_${j}" onclick="pickOpt(${i},${j})" ${answered[i]!==undefined?'disabled':''}>${String.fromCharCode(65+j)}. ${p}</button>`;
    }).join('');
    body=`<div class="helper-line">Which part has an error?</div>
    <div class="err-sentence">"${q.sentence}"</div>
    <div class="opts">${opts}</div>`;
  } else {
    if(!arState[i])arState[i]={chosen:[],available:[...SHUFFLE[i]]};
    const st=arState[i];
    const chips=SHUFFLE[i].map(ci=>`<span class="wchip${st.available.includes(ci)?'':' used'}" onclick="addC(${i},${ci})">${q.chunks[ci]}</span>`).join('');
    const achips=st.chosen.map((ci,j)=>`<button class="achip" onclick="remC(${i},${j})">${q.chunks[ci]} <em>✕</em></button>`).join('');
    const ph=st.chosen.length===0?'<span class="aph">Tap chunks to build the sentence →</span>':'';
    body=`<div class="helper-line">Put the chunks in the correct order.</div>
    <div class="chips">${chips}</div>
    <div class="abox" id="abox${i}">${ph}${achips}</div>
    <button class="ckbtn" onclick="chkArr(${i})" ${answered[i]!==undefined?'disabled':''}>Check ✓</button>`;
  }

  const allDone=done===QS.length;
  document.getElementById('app').innerHTML=`<div class="qw">
    ${renderTabs(i)}
    <div class="prog-row">
      <span class="prog-label">Question ${i+1} / ${QS.length}</span>
      <span class="prog-score">✅ ${correct} correct</span>
    </div>
    <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    <div class="qcard">
      <div class="qmeta">
        <span class="qnum">Q${i+1}</span>
        <span class="badge ${typeColor[q.t]}">${typeIcon[q.t]} ${typeLabel[q.t]}</span>
      </div>
      ${body}
      <div id="fb${i}"></div>
    </div>
    <div class="navrow">
      <div class="nav-left">
        <button class="nbtn" onclick="go(${i-1})" ${i===0?'disabled':''}>← Prev</button>
        <button class="nbtn" onclick="go(${i+1})" ${i===QS.length-1?'disabled':''}>Next →</button>
      </div>
      ${allDone?'<button class="nbtn pri" onclick="showScore()">See Results 🎉</button>':''}
    </div>
  </div>`;
  applyAdaptiveLayout();
  if(answered[i]!==undefined)restoreFB(i);
}
window.addEventListener('resize',applyAdaptiveLayout);

function t2fb(q,ok){
  return `<div class="fb ${ok?'ok':'no'}">
    <div>${ok?`✓ Correct! <strong>"${q.parts[q.correct]}"</strong> is the error.`:`✗ The error is <strong>"${q.parts[q.correct]}"</strong>.`}</div>
    <div style="margin-top:5px;font-size:12px;opacity:.85">${q.reason}</div>
    <div class="fb-label">Corrected sentence</div>
    <div class="fb-sentence">${hiHTML(q.fix)}</div>
  </div>`;}

function restoreFB(i){
  const q=QS[i];const fb=document.getElementById('fb'+i);if(!fb)return;
  const ok=answered[i]==='ok';
  if(q.t===1){
    fb.className='fb '+(ok?'ok':'no');
    fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. Answer: '+q.answer;
  }else if(q.t===2){fb.innerHTML=t2fb(q,ok);
  }else{fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. '+q.answer;}
}

function pickMCQ(i,opt){
  if(answered[i]!==undefined)return;
  const q=QS[i];const ok=opt===q.answer;
  if(ok)score++;answered[i]=ok?'ok':opt;
  // re-render to apply button states, then show feedback
  render(i);
  const fb=document.getElementById('fb'+i);
  if(fb){fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. Answer: '+q.answer;}
  updateNav();
}
function pickOpt(i,j){
  if(answered[i]!==undefined)return;
  const q=QS[i];const ok=j===q.correct;if(ok)score++;answered[i]=ok?'ok':j;
  q.parts.forEach((_,k)=>{const b=document.getElementById('op'+i+'_'+k);if(!b)return;b.disabled=true;
    if(k===q.correct)b.className='obtn correct';else if(k===j&&!ok)b.className='obtn wrong';});
  document.getElementById('fb'+i).innerHTML=t2fb(q,ok);updateNav();
}
function addC(i,ci){
  if(answered[i]!==undefined)return;const st=arState[i];
  if(!st.available.includes(ci))return;
  st.available=st.available.filter(x=>x!==ci);st.chosen.push(ci);render(i);
}
function remC(i,j){
  if(answered[i]!==undefined)return;const st=arState[i];
  const ci=st.chosen[j];st.chosen.splice(j,1);st.available.push(ci);render(i);
}
function chkArr(i){
  if(answered[i]!==undefined)return;
  const q=QS[i];const st=arState[i];
  const built=norm(st.chosen.map(ci=>q.chunks[ci]).join(' '));
  const ok=built===norm(q.answer);if(ok)score++;answered[i]=ok?'ok':'no';
  const fb=document.getElementById('fb'+i);
  fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✓ Correct! Well done!':'✗ Incorrect. '+q.answer;
  updateNav();
}
function updateNav(){
  const done=answered.filter(x=>x!==undefined).length;
  const correct=answered.filter(x=>x==='ok').length;
  const progScore=document.querySelector('.prog-score');
  if(progScore)progScore.textContent=`✅ ${correct} correct`;
  const pfill=document.querySelector('.pfill');
  if(pfill)pfill.style.width=Math.round((done/QS.length)*100)+'%';
  if(done===QS.length){
    const navrow=document.querySelector('.navrow');
    if(navrow&&!navrow.querySelector('.pri')){
      const b=document.createElement('button');b.className='nbtn pri';b.textContent='See Results 🎉';b.onclick=showScore;navrow.appendChild(b);
    }
  }
}
function go(i){if(i<0||i>=QS.length)return;cur=i;render(i);}
function showScore(){
  const correct=answered.filter(x=>x==='ok').length;
  const pct=Math.round((correct/QS.length)*100);
  const emoji=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'💪':'📖';
  const msg=pct>=90?'Excellent! You\'re a grammar star!':pct>=70?'Good job! Keep practicing.':pct>=50?'Not bad. Review and try again!':'Keep studying — you can do it!';
  const t1c=answered.filter((x,i)=>QS[i].t===1&&x==='ok').length;
  const t1t=QS.filter(q=>q.t===1).length;
  const t2c=answered.filter((x,i)=>QS[i].t===2&&x==='ok').length;
  const t2t=QS.filter(q=>q.t===2).length;
  const t3c=answered.filter((x,i)=>QS[i].t===3&&x==='ok').length;
  const t3t=QS.filter(q=>q.t===3).length;
  document.getElementById('app').innerHTML=`<div class="qw"><div class="scard">
    <div class="trophy">${emoji}</div>
    <div class="sbig">${correct}/${QS.length}</div>
    <div class="smsg">${msg}</div>
    <div class="slbl">${pct}% correct</div>
    <div class="sbreak">
      <div class="sbi">✏️ Complete: ${t1c}/${t1t}</div>
      <div class="sbi">🔍 Find error: ${t2c}/${t2t}</div>
      <div class="sbi">🔀 Arrange: ${t3c}/${t3t}</div>
    </div>
    <button class="rbtn" onclick="restart()">🔄 Try Again</button>
  </div></div>`;}
function restart(){cur=0;score=0;answered=[];arState={};render(0);}
render(0);
</script>
</body>
</html>
